<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Veriler</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #f5f6f8;
}

body {
    overflow: hidden;
}

.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}


/* =========================================
   HEADER
========================================= */

.header {
    background: #24292f;
    color: white;
    padding: 13px 16px;
    flex-shrink: 0;
}

.header-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

.title {
    font-size: 19px;
    font-weight: 600;
    flex: 1;
}

.status {
    font-size: 13px;
    opacity: .8;
}


/* =========================================
   SHEET TABS
========================================= */

.sheet-tabs {
    display: flex;
    gap: 5px;
    overflow-x: auto;
    background: white;
    border-bottom: 1px solid #ddd;
    padding: 7px 9px;
    flex-shrink: 0;
    -webkit-overflow-scrolling: touch;
}

.sheet-tabs button {
    border: none;
    background: #eeeeee;
    color: #333;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    font-size: 14px;
}

.sheet-tabs button:hover {
    background: #ddd;
}

.sheet-tabs button.active {
    background: #24292f;
    color: white;
}


/* =========================================
   TOOLBAR
========================================= */

.toolbar {
    background: white;
    padding: 8px;
    border-bottom: 1px solid #ddd;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
}

.search {
    flex: 1;
    min-width: 0;
    border: 1px solid #ccc;
    border-radius: 7px;
    padding: 10px 13px;
    font-size: 15px;
    outline: none;
}

.search:focus {
    border-color: #555;
}


/* =========================================
   TABLE
========================================= */

.table-wrapper {
    flex: 1;
    overflow: auto;
    background: white;
    position: relative;
    -webkit-overflow-scrolling: touch;
}

.table {
    position: relative;
    min-width: max-content;
}

.header-row-table {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    background: #24292f;
    color: white;
}

.header-cell {
    flex-shrink: 0;
    height: 42px;
    padding: 11px 12px;
    border-right: 1px solid #555;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.rows {
    position: relative;
}

.row {
    position: absolute;
    left: 0;
    display: flex;
    height: 42px;
}

.cell {
    flex-shrink: 0;
    height: 42px;
    padding: 11px 12px;
    border-right: 1px solid #eee;
    border-bottom: 1px solid #eee;
    background: white;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.row:nth-child(even) .cell {
    background: #fafafa;
}


/* =========================================
   LOADING
========================================= */

.loading {
    position: fixed;
    inset: 0;
    background: white;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 15px;
}

.loading.hidden {
    display: none;
}

.spinner {
    width: 35px;
    height: 35px;
    border: 4px solid #ddd;
    border-top-color: #24292f;
    border-radius: 50%;
    animation: spin .7s linear infinite;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* =========================================
   ERROR
========================================= */

.error {
    padding: 25px;
    color: #a00000;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .title {
        font-size: 17px;
    }

    .status {
        font-size: 11px;
    }

    .sheet-tabs button {
        padding: 8px 12px;
    }

    .header-cell,
    .cell {
        padding-left: 9px;
        padding-right: 9px;
    }

}
</style>
</head>


<body>

<div class="app">


    <!-- HEADER -->

    <div class="header">

        <div class="header-row">

            <div class="title">
                Veriler
            </div>

            <div
                id="status"
                class="status"
            >
                Yükleniyor...
            </div>

        </div>

    </div>


    <!-- SHEET TABS -->

    <div
        id="sheetTabs"
        class="sheet-tabs"
    ></div>


    <!-- SEARCH -->

    <div class="toolbar">

        <input
            id="search"
            class="search"
            type="search"
            placeholder="Bu sayfada ara..."
            autocomplete="off"
        >

    </div>


    <!-- TABLE -->

    <div
        id="tableWrapper"
        class="table-wrapper"
    >

        <div
            id="table"
            class="table"
        ></div>

    </div>

</div>


<!-- LOADING -->

<div
    id="loading"
    class="loading"
>

    <div class="spinner"></div>

    <div id="loadingText">
        Veriler yükleniyor...
    </div>

</div>


<script>

"use strict";


/* =========================================
   AYARLAR
========================================= */

const DATA_FILE = "data.json";

const DEFAULT_SHEET = "TICKET";

const ROW_HEIGHT = 42;

const BUFFER = 10;


/* =========================================
   GLOBAL
========================================= */

let sheets = {};

let currentSheet = "";

let rows = [];

let headers = [];

let indexes = [];

let widths = [];

let animationFrame = null;

let searchTimer = null;


/* =========================================
   ELEMENTLER
========================================= */

const loading =
    document.getElementById(
        "loading"
    );

const loadingText =
    document.getElementById(
        "loadingText"
    );

const status =
    document.getElementById(
        "status"
    );

const wrapper =
    document.getElementById(
        "tableWrapper"
    );

const table =
    document.getElementById(
        "table"
    );

const search =
    document.getElementById(
        "search"
    );

const sheetTabs =
    document.getElementById(
        "sheetTabs"
    );


/* =========================================
   VERİYİ YÜKLE
========================================= */

async function loadData() {

    try {

        loadingText.textContent =
            "Veriler yükleniyor...";

        const response =
            await fetch(
                DATA_FILE,
                {
                    cache: "default"
                }
            );

        if (!response.ok) {

            throw new Error(
                "data.json bulunamadı."
            );

        }

        const json =
            await response.json();


        /*
        Beklenen yapı:

        {
            "sheets": {

                "TICKET": {
                    "headers": [],
                    "rows": []
                },

                "SUMMARY": {
                    "headers": [],
                    "rows": []
                }

            }
        }
        */

        if (
            !json.sheets
        ) {

            throw new Error(
                "data.json içinde 'sheets' bulunamadı."
            );

        }

        sheets =
            json.sheets;


        const names =
            Object.keys(
                sheets
            );


        if (!names.length) {

            throw new Error(
                "Hiç sheet bulunamadı."
            );

        }


        /*
        TICKET varsa onu aç.
        Yoksa ilk sheet.
        */

        if (
            sheets[
                DEFAULT_SHEET
            ]
        ) {

            currentSheet =
                DEFAULT_SHEET;

        }
        else {

            currentSheet =
                names[0];

        }


        createSheetTabs();

        openSheet(
            currentSheet
        );


        loading.classList.add(
            "hidden"
        );

    }
    catch (error) {

        console.error(error);

        loading.innerHTML =
            `<div class="error">
                <strong>Veriler yüklenemedi.</strong>
                <br><br>
                ${escapeHtml(
                    error.message
                )}
            </div>`;

    }

}


/* =========================================
   SHEET SEKMELELERİ
========================================= */

function createSheetTabs() {

    sheetTabs.innerHTML = "";

    Object.keys(
        sheets
    ).forEach(
        name => {

            const button =
                document.createElement(
                    "button"
                );

            button.textContent =
                name;

            if (
                name ===
                currentSheet
            ) {

                button.classList.add(
                    "active"
                );

            }

            button.addEventListener(
                "click",
                () => {

                    openSheet(
                        name
                    );

                }
            );

            sheetTabs.appendChild(
                button
            );

        }
    );

}


/* =========================================
   SHEET AÇ
========================================= */

function openSheet(name) {

    const sheet =
        sheets[name];

    if (!sheet) {
        return;
    }

    currentSheet =
        name;

    headers =
        sheet.headers || [];

    rows =
        sheet.rows || [];


    /*
    Aramayı temizle.
    */

    search.value = "";


    /*
    Index oluştur.
    */

    indexes =
        new Array(
            rows.length
        );

    for (
        let i = 0;
        i < rows.length;
        i++
    ) {

        indexes[i] = i;

    }


    /*
    Sütun genişliklerini hesapla.
    */

    calculateWidths();


    /*
    Scroll başa.
    */

    wrapper.scrollTop = 0;

    wrapper.scrollLeft = 0;


    /*
    Tabloyu oluştur.
    */

    createTable();


    /*
    Aktif sekmeyi güncelle.
    */

    createSheetTabs();

    updateStatus();

}


/* =========================================
   SÜTUN GENİŞLİKLERİ
========================================= */

function calculateWidths() {

    widths =
        headers.map(
            (header, column) => {

                let length =
                    String(
                        header ?? ""
                    ).length;


                /*
                İlk 100 satır örneklenir.
                */

                const max =
                    Math.min(
                        rows.length,
                        100
                    );


                for (
                    let i = 0;
                    i < max;
                    i++
                ) {

                    const value =
                        rows[i]?.[
                            column
                        ];

                    if (
                        value !== undefined &&
                        value !== null
                    ) {

                        length =
                            Math.max(
                                length,
                                String(
                                    value
                                ).length
                            );

                    }

                }


                return Math.min(
                    Math.max(
                        length * 8 + 25,
                        80
                    ),
                    400
                );

            }
        );

}


/* =========================================
   TABLO
========================================= */

function createTable() {

    table.innerHTML = "";


    /*
    HEADER
    */

    const header =
        document.createElement(
            "div"
        );

    header.className =
        "header-row-table";


    headers.forEach(
        (value, i) => {

            const cell =
                document.createElement(
                    "div"
                );

            cell.className =
                "header-cell";

            cell.style.width =
                widths[i] + "px";

            cell.textContent =
                value ?? "";

            header.appendChild(
                cell
            );

        }
    );


    table.appendChild(
        header
    );


    /*
    SATIR ALANI
    */

    const rowsContainer =
        document.createElement(
            "div"
        );

    rowsContainer.className =
        "rows";

    rowsContainer.style.height =
        (
            indexes.length *
            ROW_HEIGHT
        ) + "px";


    table.appendChild(
        rowsContainer
    );


    /*
    Scroll.
    */

    wrapper.onscroll =
        scheduleRender;


    render();

}


/* =========================================
   VIRTUAL SCROLL
========================================= */

function scheduleRender() {

    if (
        animationFrame !== null
    ) {

        return;

    }

    animationFrame =
        requestAnimationFrame(
            () => {

                animationFrame =
                    null;

                render();

            }
        );

}


function render() {

    const container =
        table.querySelector(
            ".rows"
        );

    if (!container) {
        return;
    }


    const top =
        wrapper.scrollTop;

    const height =
        wrapper.clientHeight;


    let start =
        Math.floor(
            top / ROW_HEIGHT
        ) - BUFFER;


    let end =
        Math.ceil(
            (
                top +
                height
            ) /
            ROW_HEIGHT
        ) + BUFFER;


    start =
        Math.max(
            start,
            0
        );


    end =
        Math.min(
            end,
            indexes.length
        );


    container.innerHTML = "";


    /*
    SADECE GÖRÜNEN SATIRLAR
    */

    for (
        let i = start;
        i < end;
        i++
    ) {

        const originalIndex =
            indexes[i];

        const rowData =
            rows[
                originalIndex
            ];


        const row =
            document.createElement(
                "div"
            );

        row.className =
            "row";

        row.style.top =
            (
                i *
                ROW_HEIGHT
            ) + "px";


        for (
            let c = 0;
            c < headers.length;
            c++
        ) {

            const cell =
                document.createElement(
                    "div"
                );

            cell.className =
                "cell";

            cell.style.width =
                widths[c] + "px";

            cell.textContent =
                rowData?.[c] ?? "";

            row.appendChild(
                cell
            );

        }


        container.appendChild(
            row
        );

    }

}


/* =========================================
   ARAMA
========================================= */

search.addEventListener(
    "input",
    function () {

        clearTimeout(
            searchTimer
        );

        const query =
            this.value
                .trim()
                .toLocaleLowerCase(
                    "tr-TR"
                );


        searchTimer =
            setTimeout(
                () => {

                    filter(
                        query
                    );

                },
                150
            );

    }
);


/* =========================================
   FİLTRE
========================================= */

function filter(query) {

    if (!query) {

        indexes =
            new Array(
                rows.length
            );

        for (
            let i = 0;
            i < rows.length;
            i++
        ) {

            indexes[i] = i;

        }

    }
    else {

        const result = [];


        for (
            let i = 0;
            i < rows.length;
            i++
        ) {

            const row =
                rows[i];


            for (
                let c = 0;
                c < row.length;
                c++
            ) {

                const value =
                    row[c];


                if (
                    String(
                        value ?? ""
                    )
                    .toLocaleLowerCase(
                        "tr-TR"
                    )
                    .includes(
                        query
                    )
                ) {

                    result.push(i);

                    break;

                }

            }

        }


        indexes =
            result;

    }


    wrapper.scrollTop = 0;


    const container =
        table.querySelector(
            ".rows"
        );


    if (container) {

        container.style.height =
            (
                indexes.length *
                ROW_HEIGHT
            ) + "px";

    }


    render();

    updateStatus();

}


/* =========================================
   STATUS
========================================= */

function updateStatus() {

    status.textContent =
        currentSheet +
        " • " +
        indexes.length.toLocaleString(
            "tr-TR"
        ) +
        " / " +
        rows.length.toLocaleString(
            "tr-TR"
        );

}


/* =========================================
   ESCAPE
========================================= */

function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================
   BAŞLAT
========================================= */

loadData();

</script>

</body>
</html>
