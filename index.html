<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Excel Verileri</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
}

body {
    overflow: hidden;
}

.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* HEADER */

.header {
    flex-shrink: 0;
    background: #24292f;
    color: white;
    padding: 14px 18px;
}

.header-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

.title {
    font-size: 20px;
    font-weight: 600;
    flex: 1;
}

.status {
    font-size: 13px;
    opacity: .8;
}

/* TOOLBAR */

.toolbar {
    flex-shrink: 0;
    background: white;
    border-bottom: 1px solid #ddd;
    padding: 10px;
    display: flex;
    gap: 8px;
    align-items: center;
}

.search {
    flex: 1;
    min-width: 0;
    padding: 10px 13px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
    outline: none;
}

.search:focus {
    border-color: #777;
}

.button {
    border: none;
    background: #24292f;
    color: white;
    border-radius: 7px;
    padding: 10px 14px;
    cursor: pointer;
    white-space: nowrap;
}

.button:active {
    transform: scale(.98);
}

/* LOADING */

.loading {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,.96);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 15px;
}

.loading.hidden {
    display: none;
}

.spinner {
    width: 38px;
    height: 38px;
    border: 4px solid #ddd;
    border-top-color: #24292f;
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.loading-text {
    font-size: 15px;
    color: #555;
}

/* TABLE */

.table-wrapper {
    flex: 1;
    position: relative;
    overflow: auto;
    background: white;
    -webkit-overflow-scrolling: touch;
}

.virtual-table {
    position: relative;
    min-width: max-content;
}

.table-header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    background: #24292f;
    color: white;
}

.header-cell {
    flex-shrink: 0;
    padding: 11px 12px;
    border-right: 1px solid #555;
    border-bottom: 1px solid #111;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.rows-container {
    position: relative;
}

.row {
    position: absolute;
    left: 0;
    height: 42px;
    display: flex;
    width: max-content;
}

.cell {
    flex-shrink: 0;
    height: 42px;
    padding: 11px 12px;
    border-right: 1px solid #eee;
    border-bottom: 1px solid #eee;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: white;
}

.row:nth-child(even) .cell {
    background: #fafafa;
}

.cell:hover {
    background: #f0f0f0 !important;
}

/* ERROR */

.error {
    padding: 20px;
    color: #a00000;
}

/* MOBILE */

@media (max-width: 600px) {

    .header {
        padding: 11px 12px;
    }

    .title {
        font-size: 17px;
    }

    .status {
        font-size: 11px;
    }

    .toolbar {
        padding: 8px;
    }

    .button {
        padding: 10px;
        font-size: 13px;
    }

    .cell,
    .header-cell {
        padding-left: 9px;
        padding-right: 9px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="header-row">
            <div class="title">
                Excel Verileri
            </div>

            <div id="status" class="status">
                Hazırlanıyor...
            </div>
        </div>
    </div>

    <div class="toolbar">

        <input
            id="search"
            class="search"
            type="search"
            placeholder="Tabloda ara..."
            autocomplete="off"
        >

        <button
            id="download"
            class="button"
        >
            Excel
        </button>

    </div>

    <div
        id="tableWrapper"
        class="table-wrapper"
    >
        <div
            id="virtualTable"
            class="virtual-table"
        ></div>
    </div>

</div>


<div
    id="loading"
    class="loading"
>

    <div class="spinner"></div>

    <div
        id="loadingText"
        class="loading-text"
    >
        Excel yükleniyor...
    </div>

</div>


<script>

"use strict";

/*
====================================================
AYARLAR
====================================================
*/

const FILE = "data.xlsx";

const ROW_HEIGHT = 42;

const BUFFER_ROWS = 8;

const DEFAULT_COLUMN_WIDTH = 150;

const MIN_COLUMN_WIDTH = 80;

const MAX_COLUMN_WIDTH = 400;


/*
====================================================
GLOBAL VERİ
====================================================
*/

let workbook = null;

let data = [];

let headers = [];

let filteredIndexes = [];

let columnWidths = [];

let rafId = null;


/*
====================================================
ELEMENTLER
====================================================
*/

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");

const status =
    document.getElementById("status");

const tableWrapper =
    document.getElementById("tableWrapper");

const virtualTable =
    document.getElementById("virtualTable");

const search =
    document.getElementById("search");

const download =
    document.getElementById("download");


/*
====================================================
LOADING TEXT
====================================================
*/

function setLoading(text) {

    loadingText.textContent = text;

}


/*
====================================================
EXCEL YÜKLE
====================================================
*/

async function loadExcel() {

    try {

        setLoading("Excel dosyası indiriliyor...");

        const response =
            await fetch(FILE, {
                cache: "default"
            });

        if (!response.ok) {
            throw new Error(
                "data.xlsx bulunamadı (" +
                response.status +
                ")"
            );
        }

        const contentLength =
            response.headers.get(
                "content-length"
            );

        const total =
            Number(contentLength) || 0;

        const reader =
            response.body.getReader();

        const chunks = [];

        let received = 0;

        while (true) {

            const { done, value } =
                await reader.read();

            if (done) break;

            chunks.push(value);

            received += value.length;

            if (total) {

                const percent =
                    Math.round(
                        received / total * 100
                    );

                setLoading(
                    "Excel indiriliyor: " +
                    percent +
                    "%"
                );

            }

        }

        const buffer =
            new Uint8Array(received);

        let offset = 0;

        for (const chunk of chunks) {

            buffer.set(
                chunk,
                offset
            );

            offset += chunk.length;

        }

        /*
        Bellekte gereksiz kopyaları
        mümkün olduğunca azalt.
        */

        chunks.length = 0;

        setLoading(
            "Excel okunuyor..."
        );

        /*
        XLSX parse işlemi ağır olabilir.
        */

        await new Promise(
            resolve => setTimeout(
                resolve,
                20
            )
        );

        workbook =
            XLSX.read(
                buffer,
                {
                    type: "array",
                    cellDates: true,
                    cellNF: false,
                    cellStyles: false
                }
            );

        /*
        Buffer artık gerekmiyor.
        */

        buffer.fill(0);

        processFirstSheet();

    }
    catch (error) {

        console.error(error);

        loading.innerHTML =
            `<div class="error">
                <strong>Excel yüklenemedi.</strong>
                <br><br>
                ${escapeHtml(error.message)}
            </div>`;

    }

}


/*
====================================================
İLK SHEET
====================================================
*/

function processFirstSheet() {

    const sheetName =
        workbook.SheetNames[0];

    const sheet =
        workbook.Sheets[sheetName];

    setLoading(
        "Tablo hazırlanıyor..."
    );

    /*
    header:1 kullanıyoruz.
    Böylece object üretmek yerine
    doğrudan array kullanıyoruz.
    */

    data =
        XLSX.utils.sheet_to_json(
            sheet,
            {
                header: 1,
                defval: "",
                raw: true
            }
        );

    /*
    Workbook artık gerekmiyor.
    */

    workbook = null;

    if (!data.length) {

        throw new Error(
            "Excel dosyasında veri bulunamadı."
        );

    }

    headers =
        data[0] || [];

    /*
    Sütun genişliklerini hesapla.
    */

    calculateColumnWidths();

    /*
    Satır indexlerini oluştur.
    */

    filteredIndexes =
        new Array(
            Math.max(
                data.length - 1,
                0
            )
        );

    for (
        let i = 0;
        i < filteredIndexes.length;
        i++
    ) {

        filteredIndexes[i] =
            i + 1;

    }

    /*
    Tablo yüksekliği.
    */

    buildTable();

    /*
    Yükleme ekranını kapat.
    */

    loading.classList.add(
        "hidden"
    );

    updateStatus();

}


/*
====================================================
SÜTUN GENİŞLİĞİ
====================================================
*/

function calculateColumnWidths() {

    columnWidths =
        headers.map(
            (header, columnIndex) => {

                let maxLength =
                    String(
                        header ?? ""
                    ).length;

                /*
                İlk 100 satırı kontrol et.
                Tüm Excel'i taramak gereksiz.
                */

                const sampleCount =
                    Math.min(
                        data.length,
                        101
                    );

                for (
                    let r = 1;
                    r < sampleCount;
                    r++
                ) {

                    const value =
                        data[r]?.[
                            columnIndex
                        ];

                    if (
                        value !== undefined &&
                        value !== null
                    ) {

                        maxLength =
                            Math.max(
                                maxLength,
                                String(
                                    value
                                ).length
                            );

                    }

                }

                let width =
                    maxLength * 8 + 24;

                width =
                    Math.max(
                        width,
                        MIN_COLUMN_WIDTH
                    );

                width =
                    Math.min(
                        width,
                        MAX_COLUMN_WIDTH
                    );

                return width;

            }
        );

}


/*
====================================================
TABLOYU OLUŞTUR
====================================================
*/

function buildTable() {

    virtualTable.innerHTML = "";

    /*
    HEADER
    */

    const tableHeader =
        document.createElement(
            "div"
        );

    tableHeader.className =
        "table-header";

    headers.forEach(
        (header, index) => {

            const cell =
                document.createElement(
                    "div"
                );

            cell.className =
                "header-cell";

            cell.style.width =
                columnWidths[index] +
                "px";

            cell.textContent =
                header ?? "";

            tableHeader.appendChild(
                cell
            );

        }
    );

    virtualTable.appendChild(
        tableHeader
    );


    /*
    SATIR ALANI
    */

    const rowsContainer =
        document.createElement(
            "div"
        );

    rowsContainer.className =
        "rows-container";

    rowsContainer.style.height =
        (
            filteredIndexes.length *
            ROW_HEIGHT
        ) + "px";

    virtualTable.appendChild(
        rowsContainer
    );


    /*
    Scroll olayını bağla.
    */

    tableWrapper.addEventListener(
        "scroll",
        scheduleRender,
        {
            passive: true
        }
    );

    renderVisibleRows();

}


/*
====================================================
VIRTUAL SCROLL
====================================================
*/

function scheduleRender() {

    if (rafId !== null) {
        return;
    }

    rafId =
        requestAnimationFrame(
            () => {

                rafId = null;

                renderVisibleRows();

            }
        );

}


/*
====================================================
SADECE GÖRÜNEN SATIRLAR
====================================================
*/

function renderVisibleRows() {

    const rowsContainer =
        virtualTable.querySelector(
            ".rows-container"
        );

    if (!rowsContainer) {
        return;
    }

    const scrollTop =
        tableWrapper.scrollTop;

    const viewportHeight =
        tableWrapper.clientHeight;

    let start =
        Math.floor(
            scrollTop /
            ROW_HEIGHT
        ) -
        BUFFER_ROWS;

    let end =
        Math.ceil(
            (
                scrollTop +
                viewportHeight
            ) /
            ROW_HEIGHT
        ) +
        BUFFER_ROWS;

    start =
        Math.max(
            start,
            0
        );

    end =
        Math.min(
            end,
            filteredIndexes.length
        );


    /*
    Önce mevcut satırları temizle.
    */

    rowsContainer.innerHTML = "";


    /*
    Sadece ekranda gereken
    ~30-60 satırı oluştur.
    */

    for (
        let visibleIndex = start;
        visibleIndex < end;
        visibleIndex++
    ) {

        const dataIndex =
            filteredIndexes[
                visibleIndex
            ];

        const rowData =
            data[dataIndex] || [];

        const row =
            document.createElement(
                "div"
            );

        row.className =
            "row";

        row.style.top =
            (
                visibleIndex *
                ROW_HEIGHT
            ) + "px";


        for (
            let columnIndex = 0;
            columnIndex < headers.length;
            columnIndex++
        ) {

            const cell =
                document.createElement(
                    "div"
                );

            cell.className =
                "cell";

            cell.style.width =
                columnWidths[
                    columnIndex
                ] + "px";

            const value =
                rowData[
                    columnIndex
                ];

            cell.textContent =
                formatValue(value);

            row.appendChild(
                cell
            );

        }

        rowsContainer.appendChild(
            row
        );

    }

}


/*
====================================================
DEĞER FORMATLAMA
====================================================
*/

function formatValue(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    if (
        value instanceof Date
    ) {

        return value.toLocaleDateString(
            "tr-TR"
        );

    }

    return String(value);

}


/*
====================================================
ARAMA
====================================================
*/

let searchTimer = null;

search.addEventListener(
    "input",
    function () {

        clearTimeout(
            searchTimer
        );

        const query =
            this.value
                .trim()
                .toLocaleLowerCase(
                    "tr-TR"
                );

        /*
        150ms debounce.
        */

        searchTimer =
            setTimeout(
                () => {

                    filterData(
                        query
                    );

                },
                150
            );

    }
);


/*
====================================================
FİLTRELEME
====================================================
*/

function filterData(query) {

    if (!query) {

        filteredIndexes =
            new Array(
                Math.max(
                    data.length - 1,
                    0
                )
            );

        for (
            let i = 0;
            i < filteredIndexes.length;
            i++
        ) {

            filteredIndexes[i] =
                i + 1;

        }

    }
    else {

        const result = [];

        /*
        Satır satır kontrol.
        */

        for (
            let i = 1;
            i < data.length;
            i++
        ) {

            const row =
                data[i];

            let found = false;

            for (
                let c = 0;
                c < row.length;
                c++
            ) {

                const value =
                    row[c];

                if (
                    value !== undefined &&
                    value !== null &&
                    String(value)
                        .toLocaleLowerCase(
                            "tr-TR"
                        )
                        .includes(query)
                ) {

                    found = true;
                    break;

                }

            }

            if (found) {

                result.push(i);

            }

        }

        filteredIndexes =
            result;

    }


    /*
    Scroll başa dönsün.
    */

    tableWrapper.scrollTop = 0;


    /*
    Satır yüksekliğini güncelle.
    */

    const rowsContainer =
        virtualTable.querySelector(
            ".rows-container"
        );

    if (rowsContainer) {

        rowsContainer.style.height =
            (
                filteredIndexes.length *
                ROW_HEIGHT
            ) + "px";

    }

    renderVisibleRows();

    updateStatus();

}


/*
====================================================
STATUS
====================================================
*/

function updateStatus() {

    const total =
        Math.max(
            data.length - 1,
            0
        );

    const shown =
        filteredIndexes.length;

    if (shown === total) {

        status.textContent =
            total.toLocaleString(
                "tr-TR"
            ) +
            " satır";

    }
    else {

        status.textContent =
            shown.toLocaleString(
                "tr-TR"
            ) +
            " / " +
            total.toLocaleString(
                "tr-TR"
            );

    }

}


/*
====================================================
EXCEL İNDİR
====================================================
*/

download.addEventListener(
    "click",
    function () {

        const link =
            document.createElement(
                "a"
            );

        link.href =
            FILE;

        link.download =
            "data.xlsx";

        document.body.appendChild(
            link
        );

        link.click();

        link.remove();

    }
);


/*
====================================================
HTML ESCAPE
====================================================
*/

function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/*
====================================================
BAŞLAT
====================================================
*/

loadExcel();

</script>

</body>
</html>
