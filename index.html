<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>PS26</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
}

body {
    -webkit-font-smoothing: antialiased;
}

.app {
    width: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    flex: 0 0 auto;
    background: #24292f;
    color: #fff;
    padding: 11px 14px;
}

.header-row {
    display: flex;
    align-items: center;
    gap: 10px;
}

.title {
    flex: 1;
    font-size: 18px;
    font-weight: 600;
}

.status {
    font-size: 12px;
    opacity: .8;
    white-space: nowrap;
}


/* =====================================================
   SHEETS
===================================================== */

.sheet-tabs {
    flex: 0 0 auto;

    display: flex;
    gap: 5px;

    overflow-x: auto;

    padding: 7px 8px;

    background: #fff;

    border-bottom: 1px solid #ddd;

    -webkit-overflow-scrolling: touch;

    scrollbar-width: none;
}

.sheet-tabs::-webkit-scrollbar {
    display: none;
}

.sheet-tab {
    flex: 0 0 auto;

    border: 0;

    padding: 8px 13px;

    border-radius: 6px;

    background: #eee;

    color: #333;

    font-size: 13px;

    cursor: pointer;

    white-space: nowrap;
}

.sheet-tab.active {
    background: #24292f;
    color: #fff;
}

.sheet-tab.loading {
    opacity: .5;
}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar {
    flex: 0 0 auto;

    display: flex;

    padding: 7px 8px;

    background: #fff;

    border-bottom: 1px solid #ddd;
}

.search {
    width: 100%;

    border: 1px solid #ccc;

    border-radius: 7px;

    padding: 9px 12px;

    font-size: 15px;

    outline: none;

    -webkit-appearance: none;
}

.search:focus {
    border-color: #777;
}


/* =====================================================
   TABLE AREA
===================================================== */

.table-wrapper {
    flex: 1 1 auto;

    position: relative;

    overflow: auto;

    background: #fff;

    -webkit-overflow-scrolling: touch;

    overscroll-behavior: contain;
}

.table {
    position: relative;

    min-width: max-content;
}


/* =====================================================
   TABLE HEADER
===================================================== */

.table-header {
    position: sticky;

    top: 0;

    z-index: 20;

    display: flex;

    height: 40px;

    background: #24292f;

    color: #fff;
}

.header-cell {
    flex: 0 0 auto;

    height: 40px;

    padding: 10px 10px;

    border-right: 1px solid #4b5056;

    font-size: 13px;

    font-weight: 600;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =====================================================
   VIRTUAL ROWS
===================================================== */

.rows {
    position: relative;
}

.row {
    position: absolute;

    left: 0;

    display: flex;

    width: max-content;

    height: 40px;
}

.cell {
    flex: 0 0 auto;

    height: 40px;

    padding: 10px;

    border-right: 1px solid #eee;

    border-bottom: 1px solid #eee;

    background: #fff;

    font-size: 13px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.row:nth-child(even) .cell {
    background: #fafafa;
}


/* =====================================================
   LOADING
===================================================== */

.loading {
    position: fixed;

    inset: 0;

    z-index: 1000;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 13px;

    background: rgba(255,255,255,.96);
}

.loading.hidden {
    display: none;
}

.spinner {
    width: 32px;
    height: 32px;

    border: 4px solid #ddd;

    border-top-color: #24292f;

    border-radius: 50%;

    animation: spin .7s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.loading-text {
    font-size: 14px;
    color: #555;
}


/* =====================================================
   EMPTY
===================================================== */

.empty {
    padding: 30px;

    color: #777;

    font-size: 14px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .header {
        padding:
            10px
            12px;
    }

    .title {
        font-size: 16px;
    }

    .status {
        font-size: 11px;
    }

    .sheet-tab {
        padding: 8px 11px;
        font-size: 12px;
    }

    .header-cell,
    .cell {
        padding-left: 8px;
        padding-right: 8px;
    }
}
</style>
</head>


<body>


<div class="app">


    <!-- HEADER -->

    <div class="header">

        <div class="header-row">

            <div class="title">
                PS26
            </div>

            <div
                id="status"
                class="status"
            >
                TICKET
            </div>

        </div>

    </div>


    <!-- SHEETS -->

    <div
        id="sheetTabs"
        class="sheet-tabs"
    ></div>


    <!-- SEARCH -->

    <div class="toolbar">

        <input
            id="search"
            class="search"
            type="search"
            placeholder="Ara..."
            autocomplete="off"
            spellcheck="false"
        >

    </div>


    <!-- TABLE -->

    <div
        id="tableWrapper"
        class="table-wrapper"
    >

        <div
            id="table"
            class="table"
        ></div>

    </div>

</div>


<!-- LOADING -->

<div
    id="loading"
    class="loading"
>

    <div class="spinner"></div>

    <div
        id="loadingText"
        class="loading-text"
    >
        TICKET yükleniyor...
    </div>

</div>


<script>

"use strict";


/* =====================================================
   AYARLAR
===================================================== */

const DATA_PATH = "./data/";

const ROW_HEIGHT = 40;

const BUFFER_ROWS = 12;

const DEFAULT_SHEET = "TICKET";


/* =====================================================
   STATE
===================================================== */

let sheetList = [];

let sheetCache = new Map();

let currentSheet = null;

let headers = [];

let rows = [];

let indexes = [];

let widths = [];

let renderFrame = null;

let searchTimer = null;


/* =====================================================
   ELEMENTLER
===================================================== */

const loading =
    document.getElementById(
        "loading"
    );

const loadingText =
    document.getElementById(
        "loadingText"
    );

const status =
    document.getElementById(
        "status"
    );

const sheetTabs =
    document.getElementById(
        "sheetTabs"
    );

const search =
    document.getElementById(
        "search"
    );

const wrapper =
    document.getElementById(
        "tableWrapper"
    );

const table =
    document.getElementById(
        "table"
    );


/* =====================================================
   BAŞLAT
===================================================== */

async function init() {

    try {

        /*
         * İlk isteğimiz sadece 409 byte
         * civarındaki index.json.
         */

        const response =
            await fetch(
                DATA_PATH +
                "index.json",
                {
                    cache: "default"
                }
            );

        if (!response.ok) {

            throw new Error(
                "data/index.json bulunamadı."
            );

        }

        const index =
            await response.json();


        sheetList =
            index.sheets || [];


        if (!sheetList.length) {

            throw new Error(
                "Hiç sheet bulunamadı."
            );

        }


        createTabs();


        /*
         * TICKET varsa onu aç.
         */

        let defaultSheet =
            index.defaultSheet ||
            DEFAULT_SHEET;


        if (
            !sheetList.some(
                s =>
                    s.name ===
                    defaultSheet
            )
        ) {

            defaultSheet =
                sheetList[0].name;

        }


        await openSheet(
            defaultSheet
        );


        loading.classList.add(
            "hidden"
        );

    }
    catch (error) {

        console.error(error);

        loading.innerHTML =
            `
            <div style="
                max-width:90%;
                text-align:center;
                color:#a00000;
            ">
                <strong>
                    Veriler yüklenemedi.
                </strong>

                <br><br>

                ${escapeHtml(
                    error.message
                )}
            </div>
            `;

    }

}


/* =====================================================
   TABLAR
===================================================== */

function createTabs() {

    sheetTabs.innerHTML = "";


    for (
        const sheet of sheetList
    ) {

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "sheet-tab";

        button.textContent =
            sheet.name;

        button.dataset.sheet =
            sheet.name;


        button.addEventListener(
            "click",
            () => {

                openSheet(
                    sheet.name
                );

            }
        );


        sheetTabs.appendChild(
            button
        );

    }

}


/* =====================================================
   AKTİF TAB
===================================================== */

function updateActiveTab() {

    const buttons =
        sheetTabs.querySelectorAll(
            ".sheet-tab"
        );


    buttons.forEach(
        button => {

            button.classList.toggle(
                "active",
                button.dataset.sheet ===
                currentSheet
            );

        }
    );

}


/* =====================================================
   SHEET AÇ
===================================================== */

async function openSheet(
    sheetName
) {

    currentSheet =
        sheetName;


    updateActiveTab();


    search.value = "";


    status.textContent =
        sheetName;


    /*
     * Daha önce açılmışsa RAM'den kullan.
     */

    if (
        sheetCache.has(
            sheetName
        )
    ) {

        const data =
            sheetCache.get(
                sheetName
            );

        applySheet(
            data
        );

        return;

    }


    /*
     * Sheet bilgisini bul.
     */

    const info =
        sheetList.find(
            sheet =>
                sheet.name ===
                sheetName
        );


    if (!info) {
        return;
    }


    /*
     * Yükleme göstergesi.
     */

    loadingText.textContent =
        sheetName +
        " yükleniyor...";

    loading.classList.remove(
        "hidden"
    );


    /*
     * İlgili JSON'u indir.
     */

    try {

        const response =
            await fetch(
                DATA_PATH +
                info.file,
                {
                    cache: "default"
                }
            );


        if (!response.ok) {

            throw new Error(
                info.file +
                " bulunamadı."
            );

        }


        const data =
            await response.json();


        /*
         * Cache.
         */

        sheetCache.set(
            sheetName,
            data
        );


        /*
         * Eğer kullanıcı bu sırada
         * başka sheet'e geçtiyse
         * eski sonucu gösterme.
         */

        if (
            currentSheet !==
            sheetName
        ) {

            return;

        }


        applySheet(
            data
        );


        loading.classList.add(
            "hidden"
        );

    }
    catch (error) {

        console.error(error);

        loadingText.textContent =
            "Sheet yüklenemedi: " +
            error.message;

    }

}


/* =====================================================
   SHEET UYGULA
===================================================== */

function applySheet(
    data
) {

    headers =
        data.headers || [];

    rows =
        data.rows || [];


    /*
     * Index oluştur.
     */

    indexes =
        new Array(
            rows.length
        );


    for (
        let i = 0;
        i < rows.length;
        i++
    ) {

        indexes[i] = i;

    }


    /*
     * Sütun genişlikleri.
     */

    calculateWidths();


    /*
     * Scroll başa.
     */

    wrapper.scrollTop = 0;

    wrapper.scrollLeft = 0;


    /*
     * Tablo.
     */

    createTable();


    updateStatus();

}


/* =====================================================
   SÜTUN GENİŞLİKLERİ
===================================================== */

function calculateWidths() {

    widths =
        headers.map(
            (header, column) => {

                let maxLength =
                    String(
                        header ?? ""
                    ).length;


                /*
                 * Tüm 19.000 satırı taramak yerine
                 * ilk 100 satırdan tahmin ediyoruz.
                 */

                const sampleSize =
                    Math.min(
                        rows.length,
                        100
                    );


                for (
                    let i = 0;
                    i < sampleSize;
                    i++
                ) {

                    const value =
                        rows[i]?.[
                            column
                        ];


                    if (
                        value !== undefined &&
                        value !== null
                    ) {

                        const length =
                            String(
                                value
                            ).length;


                        if (
                            length >
                            maxLength
                        ) {

                            maxLength =
                                length;

                        }

                    }

                }


                /*
                 * Minimum 80px
                 * Maximum 400px
                 */

                return Math.min(
                    Math.max(
                        maxLength * 8 + 24,
                        80
                    ),
                    400
                );

            }
        );

}


/* =====================================================
   TABLO OLUŞTUR
===================================================== */

function createTable() {

    table.innerHTML = "";


    /*
     * HEADER
     */

    const header =
        document.createElement(
            "div"
        );

    header.className =
        "table-header";


    for (
        let i = 0;
        i < headers.length;
        i++
    ) {

        const cell =
            document.createElement(
                "div"
            );

        cell.className =
            "header-cell";

        cell.style.width =
            widths[i] +
            "px";

        cell.textContent =
            headers[i] ?? "";


        header.appendChild(
            cell
        );

    }


    table.appendChild(
        header
    );


    /*
     * VIRTUAL ROW CONTAINER
     */

    const rowsContainer =
        document.createElement(
            "div"
        );

    rowsContainer.className =
        "rows";

    rowsContainer.style.height =
        (
            indexes.length *
            ROW_HEIGHT
        ) +
        "px";


    table.appendChild(
        rowsContainer
    );


    render();

}


/* =====================================================
   VIRTUAL SCROLL
===================================================== */

wrapper.addEventListener(
    "scroll",
    scheduleRender,
    {
        passive: true
    }
);


function scheduleRender() {

    if (
        renderFrame !== null
    ) {

        return;

    }


    renderFrame =
        requestAnimationFrame(
            () => {

                renderFrame =
                    null;

                render();

            }
        );

}


/* =====================================================
   RENDER
===================================================== */

function render() {

    const container =
        table.querySelector(
            ".rows"
        );


    if (!container) {
        return;
    }


    const scrollTop =
        wrapper.scrollTop;


    const viewportHeight =
        wrapper.clientHeight;


    let start =
        Math.floor(
            scrollTop /
            ROW_HEIGHT
        ) -
        BUFFER_ROWS;


    let end =
        Math.ceil(
            (
                scrollTop +
                viewportHeight
            ) /
            ROW_HEIGHT
        ) +
        BUFFER_ROWS;


    start =
        Math.max(
            0,
            start
        );


    end =
        Math.min(
            indexes.length,
            end
        );


    /*
     * Sadece görünür satırları
     * DOM'a koyuyoruz.
     */

    container.innerHTML = "";


    for (
        let i = start;
        i < end;
        i++
    ) {

        const originalIndex =
            indexes[i];


        const data =
            rows[
                originalIndex
            ];


        const row =
            document.createElement(
                "div"
            );

        row.className =
            "row";


        row.style.top =
            (
                i *
                ROW_HEIGHT
            ) +
            "px";


        for (
            let column = 0;
            column < headers.length;
            column++
        ) {

            const cell =
                document.createElement(
                    "div"
                );

            cell.className =
                "cell";


            cell.style.width =
                widths[column] +
                "px";


            cell.textContent =
                data?.[
                    column
                ] ?? "";


            row.appendChild(
                cell
            );

        }


        container.appendChild(
            row
        );

    }

}


/* =====================================================
   ARAMA
===================================================== */

search.addEventListener(
    "input",
    () => {

        clearTimeout(
            searchTimer
        );


        searchTimer =
            setTimeout(
                performSearch,
                180
            );

    }
);


function performSearch() {

    const query =
        search.value
            .trim()
            .toLocaleLowerCase(
                "tr-TR"
            );


    /*
     * Arama boşsa tüm satırlar.
     */

    if (!query) {

        indexes =
            new Array(
                rows.length
            );


        for (
            let i = 0;
            i < rows.length;
            i++
        ) {

            indexes[i] = i;

        }

    }

    else {

        const result = [];


        /*
         * Aktif sheet'te ara.
         */

        for (
            let i = 0;
            i < rows.length;
            i++
        ) {

            const row =
                rows[i];


            let found =
                false;


            for (
                let c = 0;
                c < row.length;
                c++
            ) {

                const value =
                    String(
                        row[c] ?? ""
                    )
                    .toLocaleLowerCase(
                        "tr-TR"
                    );


                if (
                    value.includes(
                        query
                    )
                ) {

                    found =
                        true;

                    break;

                }

            }


            if (found) {

                result.push(i);

            }

        }


        indexes =
            result;

    }


    /*
     * Scroll başa.
     */

    wrapper.scrollTop = 0;


    /*
     * Container yüksekliği.
     */

    const container =
        table.querySelector(
            ".rows"
        );


    if (container) {

        container.style.height =
            (
                indexes.length *
                ROW_HEIGHT
            ) +
            "px";

    }


    render();

    updateStatus();

}


/* =====================================================
   STATUS
===================================================== */

function updateStatus() {

    status.textContent =
        currentSheet +
        " • " +
        formatNumber(
            indexes.length
        ) +
        " / " +
        formatNumber(
            rows.length
        );

}


function formatNumber(
    number
) {

    return Number(
        number
    ).toLocaleString(
        "tr-TR"
    );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(
    value
) {

    return String(
        value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   BAŞLAT
===================================================== */

init();

</script>

</body>
</html>
